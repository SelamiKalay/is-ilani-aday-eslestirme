version: "3.9"

services:

  # ─────────────────────────────────────────────
  # PostgreSQL + pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: ankane/pgvector
    container_name: postgres-matching
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-jobmatching}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sifre123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # N8n
  # ─────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # N8n core
      N8N_HOST:           ${N8N_HOST:-localhost}
      N8N_PORT:           5678
      N8N_PROTOCOL:       http
      WEBHOOK_URL:        http://${N8N_HOST:-localhost}:5678/
      # Security
      N8N_BASIC_AUTH_ACTIVE:   ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER:     ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin123}
      # Optional: use Postgres as n8n's own DB (more reliable than SQLite)
      # DB_TYPE:          postgresdb
      # DB_POSTGRESDB_HOST: postgres
      # DB_POSTGRESDB_PORT: 5432
      # DB_POSTGRESDB_DATABASE: n8n
      # DB_POSTGRESDB_USER: ${POSTGRES_USER:-postgres}
      # DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-sifre123}
      # Timezone
      GENERIC_TIMEZONE:   Europe/Istanbul
      TZ:                 Europe/Istanbul
    volumes:
      - n8n_data:/home/node/.n8n

  # ─────────────────────────────────────────────
  # Frontend (static HTML served via nginx)
  # ─────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: job-matching-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
